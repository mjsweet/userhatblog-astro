<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="font-family: 'JetBrains Mono', monospace;">
  <defs>
    <style>
      .box { fill: white; stroke: black; stroke-width: 5; }
      .label { fill: black; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .sublabel { fill: #1a1a1a; font-size: 12px; text-anchor: middle; }
      .arrow { stroke: black; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .arrow-label { fill: black; font-size: 11px; text-anchor: middle; }
      .accent { fill: #ff0000; stroke: black; stroke-width: 3; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="black" />
    </marker>
  </defs>

  <!-- Agent Box: x=50 y=130 w=160 h=100 → right=210, center-y=180 -->
  <rect class="box" x="50" y="130" width="160" height="100" transform="rotate(-2 130 180)" />
  <text class="label" x="130" y="170">Agent</text>
  <text class="sublabel" x="130" y="190">(Claude Code)</text>

  <!-- API Box: x=300 y=40 w=200 h=80 → left=300, right=500, bottom=120 -->
  <rect class="accent" x="300" y="40" width="200" height="80" />
  <text class="label" x="400" y="72" fill="white">Intake API</text>
  <text class="sublabel" x="400" y="92" fill="white">POST + GET</text>

  <!-- Form Box: x=300 y=260 w=200 h=80 → right=500, top=260 -->
  <rect class="accent" x="300" y="260" width="200" height="80" />
  <text class="label" x="400" y="292" fill="white">Token URL</text>
  <text class="sublabel" x="400" y="312" fill="white">pre-filled form</text>

  <!-- Person Box: x=590 y=130 w=160 h=100 → left=590, top=130, center-y=180 -->
  <rect class="box" x="590" y="130" width="160" height="100" transform="rotate(2 670 180)" />
  <text class="label" x="670" y="170">Person</text>
  <text class="sublabel" x="670" y="190">(browser)</text>

  <!-- Agent to API: right edge of Agent (210) → left edge of API (300) -->
  <path class="arrow" d="M 210 160 L 255 160 L 255 80 L 300 80" />
  <text class="arrow-label" x="255" y="70">create</text>

  <!-- API to Form: bottom of API (120) → top of Form (260) -->
  <line class="arrow" x1="400" y1="120" x2="400" y2="260" />
  <text class="arrow-label" x="435" y="195">token</text>

  <!-- Form to Person: right edge of Form (500) → left edge of Person (590) -->
  <path class="arrow" d="M 500 300 L 545 300 L 545 180 L 590 180" />
  <text class="arrow-label" x="558" y="265">opens</text>

  <!-- Person to API: top of Person (130) → right edge of API (500) -->
  <path class="arrow" d="M 670 130 L 670 80 L 500 80" />
  <text class="arrow-label" x="590" y="70">submits</text>

  <!-- API to Agent: left edge of API (300) → right edge of Agent (210) -->
  <path class="arrow" d="M 300 60 L 255 60 L 255 200 L 210 200" />
  <text class="arrow-label" x="255" y="220">retrieve</text>

  <!-- Decorative brutalist elements -->
  <rect fill="#ffff00" stroke="black" stroke-width="3" x="10" y="10" width="40" height="8" transform="rotate(5 30 14)" />
  <rect fill="#ffff00" stroke="black" stroke-width="3" x="750" y="10" width="40" height="8" transform="rotate(-5 770 14)" />
  <rect fill="#ffff00" stroke="black" stroke-width="3" x="10" y="380" width="40" height="8" transform="rotate(-3 30 384)" />
</svg>
